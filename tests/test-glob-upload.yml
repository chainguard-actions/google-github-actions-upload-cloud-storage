name: Test glob pattern upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test files for glob upload
        run: |
          mkdir -p /tmp/glob-test
          echo "file one" > /tmp/glob-test/file1.txt
          echo "file two" > /tmp/glob-test/file2.txt
          echo "not a txt" > /tmp/glob-test/file3.log

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: /tmp/glob-test
          destination: 'fake-bucket-for-testing/prefix'
          glob: '*.txt'
          gzip: 'false'
          resumable: 'false'
          parent: 'false'

      - name: Assert action ran and failed gracefully (no GCP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          UPLOADED: ${{ steps.action.outputs.uploaded }}
        run: |
          echo "outcome: $OUTCOME"
          echo "uploaded: $UPLOADED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$UPLOADED" ]; then
              echo "FAIL: action succeeded but uploaded output is empty"
              exit 1
            fi
            echo "PASS: action succeeded and uploaded: $UPLOADED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected - no GCP credentials in test harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
