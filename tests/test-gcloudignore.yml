name: Test gcloudignore processing (no credentials)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test files and gcloudignore
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ignore-test"
          echo "include me" > "$GITHUB_WORKSPACE/ignore-test/include.txt"
          echo "exclude me" > "$GITHUB_WORKSPACE/ignore-test/exclude.log"
          # Write a gcloudignore file that excludes .log files
          printf '*.log\n' > "$GITHUB_WORKSPACE/ignore-test/.gcloudignore"

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: '${{ github.workspace }}/ignore-test'
          destination: 'test-bucket-does-not-exist/ignore-prefix'
          gzip: 'false'
          resumable: 'false'
          process_gcloudignore: 'true'
          gcloudignore_path: '${{ github.workspace }}/ignore-test/.gcloudignore'

      - name: Assert action ran and failed gracefully (no GCS credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          UPLOADED: ${{ steps.action.outputs.uploaded }}
        run: |
          echo "outcome: $OUTCOME"
          echo "uploaded: $UPLOADED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$UPLOADED" ]; then
              echo "FAIL: action succeeded but uploaded output is empty"
              exit 1
            fi
            echo "PASS: uploaded output: $UPLOADED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — no GCS credentials in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
