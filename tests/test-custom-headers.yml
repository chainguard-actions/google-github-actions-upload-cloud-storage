name: Test custom headers and options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file with content
        run: |
          mkdir -p /tmp/headers-test
          echo '{"key": "value"}' > /tmp/headers-test/data.json

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: /tmp/headers-test/data.json
          destination: 'fake-bucket-for-testing/json-uploads'
          gzip: 'false'
          resumable: 'false'
          predefinedAcl: 'private'
          headers: |-
            content-type: 'application/json'
            x-goog-meta-env: 'test'

      - name: Assert action ran and failed gracefully (no GCP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          UPLOADED: ${{ steps.action.outputs.uploaded }}
        run: |
          echo "outcome: $OUTCOME"
          echo "uploaded: $UPLOADED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$UPLOADED" ]; then
              echo "FAIL: action succeeded but uploaded output is empty"
              exit 1
            fi
            echo "PASS: action succeeded and uploaded: $UPLOADED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected - no GCP credentials in test harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
