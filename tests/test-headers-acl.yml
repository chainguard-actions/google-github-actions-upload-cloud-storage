name: Test headers and predefined ACL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file with metadata
        run: |
          mkdir -p "$GITHUB_WORKSPACE/meta-test"
          echo '{"key":"value"}' > "$GITHUB_WORKSPACE/meta-test/data.json"

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: meta-test/data.json
          destination: 'my-test-bucket-does-not-exist/meta-prefix'
          gzip: 'false'
          resumable: 'false'
          predefinedAcl: 'projectPrivate'
          process_gcloudignore: 'false'
          headers: |-
            content-type: 'application/json'
            x-goog-meta-env: 'test'

      - name: Assert action ran (succeeds with real creds, fails gracefully without)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          UPLOADED: ${{ steps.action.outputs.uploaded }}
        run: |
          echo "outcome: $OUTCOME"
          echo "uploaded: $UPLOADED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$UPLOADED" ]; then
              echo "FAIL: action succeeded but uploaded output is empty"
              exit 1
            fi
            echo "PASS: uploaded='$UPLOADED'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no GCP credentials in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
