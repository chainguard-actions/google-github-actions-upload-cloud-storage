name: Test gcloudignore processing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test files and gcloudignore
        run: |
          mkdir -p /tmp/ignore-test
          echo "upload me" > /tmp/ignore-test/include.txt
          echo "ignore me" > /tmp/ignore-test/exclude.log
          echo "exclude.log" > /tmp/ignore-test/.gcloudignore

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: /tmp/ignore-test
          destination: 'fake-bucket-for-testing'
          gzip: 'false'
          resumable: 'false'
          process_gcloudignore: 'true'
          gcloudignore_path: '/tmp/ignore-test/.gcloudignore'

      - name: Assert action ran and failed gracefully (no GCP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          UPLOADED: ${{ steps.action.outputs.uploaded }}
        run: |
          echo "outcome: $OUTCOME"
          echo "uploaded: $UPLOADED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$UPLOADED" ]; then
              echo "FAIL: action succeeded but uploaded output is empty"
              exit 1
            fi
            echo "PASS: action succeeded and uploaded: $UPLOADED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected - no GCP credentials in test harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
